   var apiKey = "GEMINI_API_KEY_BECAUSE_I_AM_TOO_LAZY_TO_USE_CLOUDFLARE_F";
var x1 = "Pretend to be a fortune teller responding to the fallowing prompts, like, really hippy dippy type replies, but occationally change your accent to a stereotypical mallinial or angsty teen/";

var askGemini = function(x) {
    var xhr = new XMLHttpRequest();
    

    xhr.open("POST", "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent", true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.setRequestHeader("x-goog-api-key", apiKey);

    xhr.onload = function() {
        if (xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            var reply = data.candidates[0].content.parts[0].text;
            console.log(reply);
          return reply;
        } else {
            console.log("Error:", xhr.status, xhr.responseText);
        }
    };

    xhr.onerror = function() {
        //console.log("Network error or smth");
    };

    xhr.send(JSON.stringify({
        contents: [{
            role: "user",
            parts: [{
                text: String(x)
            }]
        }]
    }));
};
var oldButtons = [];
    
var checkButtons = async function() {
    var i = -1;
    do {
        i++;
        if (i % 16 === 0)
            await new Promise(requestAnimationFrame); //hand control over to the browser every so often
    } while (gp && !gp.buttons[i %= 16].pressed);
    return i;
};
var waitForButton = function() {
  //make an awaitable function that checks if the d pad or the a button is pressed, halting when they are
    return new Promise(function(resolve) {
         
            var gp = navigator.getGamepads()[0], hit = -1;

            if (gp) 
              for (let i = 0; i < gp.buttons.length; i++) {
                if (gp.buttons[i].pressed && !oldButtons[i] && hit === -1) hit = i;
                oldButtons[i] = gp.buttons[i].pressed;
            }

            if (hit !== -1) resolve(hit);
            else requestAnimationFrame(check);
        
        
    });
};
askGemini(x1);

    var dialogchain=function(Wdlst,sn, pos=0){
      //Wdlst is assumed to be a json file path
      //this stores a few things, it looks at the prior diolog for context 
      this.wordlist=Wdlst; //this is a JSON of words, Wdlst stores the directory, using require because this is in a constructor and well...actually since I forced an import, this mess fixes it
      this.sentArr=sn; //holds the current sentence array
      this.cwattr=pos; //tells you whether this word is a subject, verb, adverb, adjectictive, object, or conjunction
    }
   dialogchain.dSbox=function(x,y,txt){
      /*Subject
      

Adverb*

Verb

Adverb*

Adjective*

Object

Modifier*

Conjunction
*/

    //this.x=x;
      //this.y=y;
      //this.txt=txt;
     this.x=x;
     this.y=y;
     this.txt=txt;
     this.isSelected=false;
     

    rect(x, y - textAscent(), textWidth(txt), textAscent()+textDescent());
    text(txt, x, y);

    }
    dialogchain.dSbox.prototype.update=function(){
      
    rect(this.x, this.y - textAscent(), textWidth(this.txt), textAscent()+textDescent());
    text(this.txt, this.x, this.y);
      if(this.isSelected) fill(278,20,2); //purely to let you know when an object is selected
    }
  var Opts = [
    "subject",
    "adverb",
    "verb",
    "adverb",
    "adjective",
    "object",
    "modifier",
    "conjunction",
    "date"
]; //stores options for the diolog output, 3 at a time
    dialogchain.prototype.generate=function(){
      //pick from wordlist a random value
      
    var words = this.wordlist[Opts[this.cwattr]];

    this.options = [];
   

    if (!words.length) throw new Error("we may have a wordbank or access problem");
    
    for (var i = 0; i < 3; i++) {
        this.options.push(new dialogchain.dSbox(200+(this.sentArr.length)?textWidth(this.sentArr[this.sentArr.length-1])*i:0,300,words[Math.floor(Math.random() * words.length)]));
        //all spaced out and on the screen..ternary required because if the first entry does not exist, there is no offset
    }

    return this.options; //holds the dialog box array
};

// Select one of the 3 generated words, this is where the loop begins
dialogchain.prototype.select = async function(i) {
    
   this.options[0].isSelected = true;
//var jprev=0;
var j=0;
    while (i!==9) {
      i=await checkbuttons();
        switch (i) {
            case 14: ///left d pad is hit
            this.options[j].isSelected=false;
            this.options[j].update();
                if(!(j)) j=2; else j--;
            this.options[j].isSelected=true;
            this.options[j].update();
            continue;
            //var j=await checkbuttons(); //essentally, halt this function until a button is pressed
            //iprev=i;
            //i=((i+j)<=5 &&(i+j)!==-1 ? (j==0)? ) 
                
                //break;

            case 15: //right d pad
                        this.options[j].isSelected=false;
                        this.options[j].update();
                if(j==2) j=0; else j++;
            this.options[j].isSelected=true;
            this.options[j].update();
            
                
                continue;
                // Intentional fallthrough

            case 8: // Skip
            
                this.cwattr = (++this.cwattr) % Opts.length;
                return this.generate();

             //this.options[0].isSelected = true;
            iprev=0;
                break;

            case 9: // Send
            background(0,0,0);
              return  dialogchain.dSbox(200,200,askGemini(this.getSentence()));
            
                
            break;
        }
      this.options[j].isSelected=true;
      this.options[j].update();
      iprev=i;

        i = await waitForButton();
    }
  print("do you want a new fortune?")
};
    

// Repeat the current category, useful for adjectives/adverbs
dialogchain.prototype.repeat = function() {
    return this.generate();
};
